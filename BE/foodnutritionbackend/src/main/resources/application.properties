spring.application.name=foodnutritionbackend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/food_nutrition_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

server.error.include-message=never
server.error.include-stacktrace=never

foodlens.ai-labels-url=http://localhost:8000/labels
foodlens.ai-url=http://localhost:8000/predict
foodlens.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}